<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Navbat olish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14181f);--hint:var(--tg-theme-hint-color,#7b8494);--card:var(--tg-theme-secondary-bg-color,#f0f2f5);--ac:var(--tg-theme-button-color,#2481cc);--act:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.pole{height:10px;margin:0 -16px 18px;background:repeating-linear-gradient(-45deg,#d6342c 0 10px,#fff 10px 20px,#2b5fb4 20px 30px,#fff 30px 40px)}
h1{font-size:26px;letter-spacing:-.02em;margin-bottom:2px}
.sub{color:var(--hint);margin-bottom:22px}
h2{font-size:15px;font-weight:600;margin:22px 0 10px}
.row{display:grid;gap:8px}
#svc{grid-template-columns:1fr}
#days{grid-template-columns:repeat(4,1fr)}
#hours{grid-template-columns:repeat(3,1fr)}
.chip{font:inherit;color:var(--tx);background:var(--card);border:2px solid transparent;border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
#svc .chip{flex-direction:row;justify-content:space-between;padding:14px}
.chip small{color:var(--hint);font-size:13px}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--bg))}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint{color:var(--hint);grid-column:1/-1}
</style>
</head>
<body>
<div class="pole"></div>
<h1>Navbat olish</h1>
<p class="sub">Xizmat, kun va vaqtni tanlang. Sartarosh tasdiqlagach xabar keladi.</p>
<h2>Xizmat</h2><div id="svc" class="row"></div>
<h2>Kun</h2><div id="days" class="row"></div>
<h2>Vaqt</h2><div id="hours" class="row"></div>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const SERVICES = [["1","✂️ Soch olish",50000],["2","🧔 Soqol",30000],["3","💈 Soch + soqol",70000]]; // bot.py bilan bir xil bo'lsin
const HOURS = Array.from({length:10},(_,i)=>String(i+9).padStart(2,"0")+":00");
const WD = ["Yak","Dush","Sesh","Chor","Pay","Juma","Shan"];
const qs = new URLSearchParams(location.search);
const busy = new Set((qs.get("busy")||"").split(",").filter(Boolean));
const off = new Set((qs.get("off")||"").split(",").filter(Boolean));
const sel = {s:null,d:null,t:null};
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowTash = () => new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tashkent"}));

function free(day){
  if (off.has(day)) return [];
  const [y,m,d] = day.split("-").map(Number), n = nowTash();
  return HOURS.filter(h => !busy.has(day+"_"+h.replace(":","")) &&
    new Date(y,m-1,d,+h.slice(0,2)) - n >= 30*60000);
}
function chip(html,on,dis,fn){
  const b = document.createElement("button");
  b.className = "chip"+(on?" on":""); b.disabled = dis; b.innerHTML = html; b.onclick = fn;
  return b;
}
function render(){
  const $ = id => { const e = document.getElementById(id); e.innerHTML = ""; return e; };
  const sv = $("svc"), dy = $("days"), hr = $("hours");
  SERVICES.forEach(([id,name,price]) => sv.append(chip(
    `<span>${name}</span><small>${price.toLocaleString("ru")} so'm</small>`, sel.s===id, false, () => {sel.s=id; render();})));
  for (let i=0;i<7;i++){
    const d = nowTash(); d.setDate(d.getDate()+i); const k = iso(d);
    const lab = i===0 ? "Bugun" : i===1 ? "Ertaga" : WD[d.getDay()];
    dy.append(chip(`${lab}<small>${pad(d.getDate())}.${pad(d.getMonth()+1)}</small>`,
      sel.d===k, !free(k).length, () => {sel.d=k; sel.t=null; render();}));
  }
  if (!sel.d) hr.innerHTML = '<p class="hint">Avval kunni tanlang.</p>';
  else free(sel.d).forEach(h => hr.append(chip(h, sel.t===h, false, () => {sel.t=h; render();})));
  const ok = sel.s && sel.d && sel.t;
  if (ok){ tg.MainButton.setText(`Yuborish: ${sel.d.slice(8)}.${sel.d.slice(5,7)} ${sel.t}`); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
tg.MainButton.onClick(() => tg.sendData(JSON.stringify(sel)));
render();
</script>
</body>
</html>
